[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surgphase"
version = "1.0.0"
description = "Surgical phase recognition on Cholec80 with a CNN encoder and a temporal model"
requires-python = ">=3.10"
dependencies = [
  "numpy", "pandas", "opencv-python", "pillow", "torch", "torchvision", "timm",
  "matplotlib", "plotly", "streamlit", "requests", "remotezip",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
